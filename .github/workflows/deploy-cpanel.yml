name: Deploy to cPanel via FTPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployable files
        run: |
          rm -f .env

      - name: Upload application to cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            .git/**
            **/.git/**
            **/.gitignore
            **/.gitattributes
            **/.github/**
            **/node_modules/**
            .env

      - name: Trigger database migrations
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "${{ secrets.MIGRATION_URL }}" \
            -H "X-Migration-Token: ${{ secrets.MIGRATION_TOKEN }}"
